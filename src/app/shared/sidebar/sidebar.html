<aside class="sidebar">

  <!-- =====================================================
       MENU HEADER
       ===================================================== -->

  <div
    class="menu-header"
    [class.active]="menuOpen"
    (click)="toggleMenu()"
    role="button"
    tabindex="0"
    (keydown.enter)="toggleMenu()"
    (keydown.space)="toggleMenu()"
  >

    <span>
      MENU
    </span>

    <span
      class="menu-arrow"
      [class.open]="menuOpen"
    >
      ▼
    </span>

  </div>


  <!-- =====================================================
       NAVIGATION MODULES
       ===================================================== -->

  @if (menuOpen) {

    <nav class="sidebar-nav">

      <!-- =================================================
           DASHBOARD
           ================================================= -->

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >
        <span>
          Dashboard
        </span>
      </a>


      <!-- =================================================
           ADMIN MODULES
           ================================================= -->

      @if (isAdmin) {

        <!-- PATIENTS -->

        <a
          routerLink="/users"
          routerLinkActive="active"
          class="nav-item"
        >
          <span>
            Patients
          </span>
        </a>


        <!-- UPLOAD PATIENTS -->

        <a
          routerLink="/upload"
          routerLinkActive="active"
          class="nav-item"
        >
          <span>
            Upload Patients
          </span>
        </a>

      }


      <!-- =================================================
           VISITOR CHECK
           ================================================= -->

      <a
        routerLink="/visitor-check"
        routerLinkActive="active"
        class="nav-item"
      >
        <span>
          Visitor Check
        </span>
      </a>


      <!-- =================================================
           REPORTS
           ================================================= -->

      @if (isAdmin) {

        <a
          routerLink="/reports"
          routerLinkActive="active"
          class="nav-item"
        >
          <span>
            Reports
          </span>
        </a>

      }

    </nav>

  }

</aside>

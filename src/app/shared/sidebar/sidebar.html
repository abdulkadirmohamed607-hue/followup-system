<aside class="sidebar">

  <!-- ========================= -->
  <!-- MENU HEADER -->
  <!-- ========================= -->

  <div
  class="menu-header"
  [class.active]="menuOpen"
  (click)="toggleMenu()"
  role="button"
  tabindex="0"
  (keydown.enter)="toggleMenu()"
  (keydown.space)="toggleMenu()"
>

  <span>
    MENU
  </span>

  <span
    class="menu-arrow"
    [class.open]="menuOpen"
  >
    ▼
  </span>

</div>


  <!-- ========================= -->
  <!-- NAVIGATION MODULES -->
  <!-- ========================= -->

  @if (menuOpen) {

    <nav class="sidebar-nav">

      <!-- ========================= -->
      <!-- DASHBOARD -->
      <!-- ========================= -->

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-item"
      >

        <span>
          Dashboard
        </span>

      </a>


      <!-- ========================= -->
      <!-- ADMIN MODULES -->
      <!-- ========================= -->

      @if (isAdmin) {

        <!-- USERS -->

        <a
          routerLink="/users"
          routerLinkActive="active"
          class="nav-item"
        >

          <span>
            Users
          </span>

        </a>


        <!-- ADD USER -->

        <a
          routerLink="/users/add"
          routerLinkActive="active"
          class="nav-item"
        >

          <span>
            Add User
          </span>

        </a>


        <!-- UPLOAD USERS -->

        <a
          routerLink="/upload"
          routerLinkActive="active"
          class="nav-item"
        >

          <span>
            Upload Users
          </span>

        </a>

      }


      <!-- ========================= -->
      <!-- VISITOR CHECK -->
      <!-- ========================= -->

      <a
        routerLink="/visitor-check"
        routerLinkActive="active"
        class="nav-item"
      >

        <span>
          Visitor Check
        </span>

      </a>


      <!-- ========================= -->
      <!-- REPORTS -->
      <!-- ========================= -->

      @if (isAdmin) {

        <a
          routerLink="/reports"
          routerLinkActive="active"
          class="nav-item"
        >

          <span>
            Reports
          </span>

        </a>

      }

    </nav>

  }

</aside>

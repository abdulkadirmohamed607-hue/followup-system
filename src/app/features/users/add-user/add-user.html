<div class="add-user-container">

  <!-- HEADER -->

  <div class="page-header">

    <div>

      <h1>
        Add Patient
      </h1>

      <p>
        Add a new patient manually
      </p>

    </div>

  </div>


  <!-- FORM CARD -->

  <div class="form-card">

    <form
      #patientForm="ngForm"
      (ngSubmit)="savePatient(patientForm)"
    >


      <!-- FIRST NAME -->

      <div class="form-group">

        <label>
          First Name
        </label>

        <input
          type="text"
          name="firstName"
          [(ngModel)]="firstName"
          required
          placeholder="Enter first name"
        />

      </div>


      <!-- SECOND NAME -->

      <div class="form-group">

        <label>
          Second Name
        </label>

        <input
          type="text"
          name="secondName"
          [(ngModel)]="secondName"
          required
          placeholder="Enter second name"
        />

      </div>


      <!-- LAST NAME -->

      <div class="form-group">

        <label>
          Last Name
        </label>

        <input
          type="text"
          name="lastName"
          [(ngModel)]="lastName"
          required
          placeholder="Enter last name"
        />

      </div>


      <!-- PATIENT NUMBER -->

      <div class="form-group">

        <label>
          Patient Number
        </label>

        <input
          type="text"
          name="patientNumber"
          [(ngModel)]="patientNumber"
          required
          placeholder="Enter patient number"
        />

      </div>


      <!-- WARD -->

      <div class="form-group">

        <label>
          Ward
        </label>

        <input
          type="text"
          name="ward"
          [(ngModel)]="ward"
          required
          placeholder="Enter ward"
        />

      </div>


      <!-- ADMISSION DATE -->

      <div class="form-group">

        <label>
          Admission Date
        </label>

        <input
          type="date"
          name="admissionDate"
          [(ngModel)]="admissionDate"
          required
        />

      </div>


      <!-- STATUS -->

      <div class="form-group">

        <label>
          Patient Status
        </label>

        <select
          name="status"
          [(ngModel)]="status"
          required
        >

          <option value="Admitted">
            Admitted
          </option>

          <option value="Discharged">
            Discharged
          </option>

        </select>

      </div>


      <!-- BUTTONS -->

      <div class="form-actions">

        <button
          type="submit"
          class="save-button"
        >

          <i class="bi bi-person-plus me-1"></i>

          Save Patient

        </button>


        <button
          type="button"
          class="cancel-button"
          (click)="cancel()"
        >

          <i class="bi bi-x-circle me-1"></i>

          Cancel

        </button>

      </div>

    </form>

  </div>

</div>

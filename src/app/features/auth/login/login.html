<div class="login-page">

  <div class="login-card">

    <!-- HEADER -->

    <div class="login-header">

      <!-- SYSTEM LOGO -->

      <div class="logo">

        <img
          src="assets/logo.jpg"
          alt="FollowUp System Logo"
        >

      </div>

      <h1>
        Tanga RRH
      </h1>

    </div>


    <!-- ERROR -->

    @if (errorMessage) {

      <div class="alert alert-danger">

        <i class="bi bi-exclamation-circle me-2"></i>

        {{ errorMessage }}

      </div>

    }


    <!-- LOGIN FORM -->

    <form
      novalidate
      (submit)="$event.preventDefault(); loginButtonClicked()"
    >

      <!-- USERNAME -->

      <div class="mb-3">

        <label
          for="username"
          class="form-label"
        >
          Username
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-person"></i>

          </span>

          <input
            id="username"
            type="text"
            class="form-control"
            name="username"
            [(ngModel)]="username"
            required
            autocomplete="username"
            placeholder="Enter username"
          />

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="mb-3">

        <label
          for="password"
          class="form-label"
        >
          Password
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-lock"></i>

          </span>

          <input
            id="password"
            [type]="
              showPassword
                ? 'text'
                : 'password'
            "
            class="form-control"
            name="password"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
            placeholder="Enter password"
          />

          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="togglePassword()"
          >

            <i
              class="bi"
              [class.bi-eye]="!showPassword"
              [class.bi-eye-slash]="showPassword"
            ></i>

          </button>

        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        class="btn btn-primary w-100 login-button"
        [disabled]="loading"
      >

        @if (loading) {

          <span
            class="spinner-border spinner-border-sm me-2"
          ></span>

          Logging in...

        }

        @else {

          <i
            class="bi bi-box-arrow-in-right me-2"
          ></i>

          Login

        }

      </button>

    </form>

  </div>

</div>

<div class="change-password-page">

  <div class="change-password-card">

    <!-- ======================================
         HEADER
         ====================================== -->

    <div class="change-password-header">

      <div class="logo">

        <img
          src="assets/logo.jpg"
          alt="FollowUp System Logo"
        >

      </div>

      <h1>
        Change Password
      </h1>

      <p>
        Please change your password to continue
      </p>

    </div>


    <!-- ======================================
         INFO MESSAGE
         ====================================== -->

    <div class="alert alert-warning info-alert">

      <i class="bi bi-shield-lock me-2"></i>

      For security reasons, you must change your
      password before continuing.

    </div>


    <!-- ======================================
         ERROR
         ====================================== -->

    @if (errorMessage) {

      <div class="alert alert-danger">

        <i class="bi bi-exclamation-circle me-2"></i>

        {{ errorMessage }}

      </div>

    }


    <!-- ======================================
         SUCCESS
         ====================================== -->

    @if (successMessage) {

      <div class="alert alert-success">

        <i class="bi bi-check-circle me-2"></i>

        {{ successMessage }}

      </div>

    }


    <!-- ======================================
         CHANGE PASSWORD FORM
         ====================================== -->

    <form
      novalidate
      (submit)="$event.preventDefault(); changePassword()"
    >


      <!-- ====================================
           CURRENT PASSWORD
           ==================================== -->

      <div class="mb-3">

        <label
          for="oldPassword"
          class="form-label"
        >
          Current Password
        </label>


        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-lock"></i>

          </span>


          <input
            id="oldPassword"
            [type]="
              showOldPassword
                ? 'text'
                : 'password'
            "
            class="form-control"
            name="oldPassword"
            [(ngModel)]="oldPassword"
            required
            autocomplete="current-password"
            placeholder="Enter current password"
          />


          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="toggleOldPassword()"
          >

            <i
              class="bi"
              [class.bi-eye]="!showOldPassword"
              [class.bi-eye-slash]="showOldPassword"
            ></i>

          </button>

        </div>

      </div>



      <!-- ====================================
           NEW PASSWORD
           ==================================== -->

      <div class="mb-3">

        <label
          for="newPassword"
          class="form-label"
        >
          New Password
        </label>


        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-shield-lock"></i>

          </span>


          <input
            id="newPassword"
            [type]="
              showNewPassword
                ? 'text'
                : 'password'
            "
            class="form-control"
            name="newPassword"
            [(ngModel)]="newPassword"
            required
            autocomplete="new-password"
            placeholder="Enter new password"
          />


          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="toggleNewPassword()"
          >

            <i
              class="bi"
              [class.bi-eye]="!showNewPassword"
              [class.bi-eye-slash]="showNewPassword"
            ></i>

          </button>

        </div>

      </div>



      <!-- ====================================
           CONFIRM PASSWORD
           ==================================== -->

      <div class="mb-3">

        <label
          for="confirmPassword"
          class="form-label"
        >
          Confirm New Password
        </label>


        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-shield-check"></i>

          </span>


          <input
            id="confirmPassword"
            [type]="
              showConfirmPassword
                ? 'text'
                : 'password'
            "
            class="form-control"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            autocomplete="new-password"
            placeholder="Confirm new password"
          />


          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="toggleConfirmPassword()"
          >

            <i
              class="bi"
              [class.bi-eye]="!showConfirmPassword"
              [class.bi-eye-slash]="showConfirmPassword"
            ></i>

          </button>

        </div>

      </div>



      <!-- ====================================
           CHANGE PASSWORD BUTTON
           ==================================== -->

      <button
        type="submit"
        class="btn btn-primary w-100 change-password-button"
        [disabled]="loading"
      >

        @if (loading) {

          <span
            class="spinner-border spinner-border-sm me-2"
          ></span>

          Changing Password...

        }

        @else {

          <i
            class="bi bi-key me-2"
          ></i>

          Change Password

        }

      </button>


    </form>


    <!-- ======================================
         LOGOUT
         ====================================== -->

    <button
      type="button"
      class="btn btn-link logout-button"
      (click)="logout()"
      [disabled]="loading"
    >

      <i class="bi bi-box-arrow-left me-1"></i>

      Logout

    </button>

  </div>

</div>

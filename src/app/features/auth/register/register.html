<div class="register-page">

  <div class="register-card">

    <!-- HEADER -->

    <div class="register-header">

      <div class="logo">

        <i class="bi bi-hospital"></i>

      </div>

      <h1>
        FollowUp System
      </h1>

      <p>
        Create User Account
      </p>

    </div>


    <!-- ERROR -->

    @if (errorMessage) {

      <div class="alert alert-danger">

        <i
          class="bi bi-exclamation-circle me-2"
        ></i>

        {{ errorMessage }}

      </div>

    }


    <!-- SUCCESS -->

    @if (successMessage) {

      <div class="alert alert-success">

        <i
          class="bi bi-check-circle me-2"
        ></i>

        {{ successMessage }}

      </div>

    }


    <!-- REGISTER FORM -->

    <form
      #registerForm="ngForm"
      (ngSubmit)="register(registerForm)"
    >

      <!-- FULL NAME -->

      <div class="mb-3">

        <label class="form-label">
          Full Name
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-person"></i>

          </span>

          <input
            type="text"
            class="form-control"
            name="fullName"
            [(ngModel)]="fullName"
            required
            placeholder="Enter full name"
          />

        </div>

      </div>


      <!-- USERNAME -->

      <div class="mb-3">

        <label class="form-label">
          Username
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-person-badge"></i>

          </span>

          <input
            type="text"
            class="form-control"
            name="username"
            [(ngModel)]="username"
            required
            placeholder="Create username"
          />

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="mb-3">

        <label class="form-label">
          Password
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-lock"></i>

          </span>

          <input
            type="password"
            class="form-control"
            name="password"
            [(ngModel)]="password"
            required
            minlength="6"
            placeholder="Create password"
          />

        </div>

      </div>


      <!-- CONFIRM PASSWORD -->

      <div class="mb-3">

        <label class="form-label">
          Confirm Password
        </label>

        <div class="input-group">

          <span class="input-group-text">

            <i class="bi bi-lock-fill"></i>

          </span>

          <input
            type="password"
            class="form-control"
            name="confirmPassword"
            [(ngModel)]="confirmPassword"
            required
            placeholder="Confirm password"
          />

        </div>

      </div>


      <!-- REGISTER BUTTON -->

      <button
        type="submit"
        class="btn btn-primary w-100 register-button"
        [disabled]="loading"
      >

        @if (loading) {

          <span
            class="spinner-border spinner-border-sm me-2"
          ></span>

          Creating account...

        }

        @else {

          <i
            class="bi bi-person-plus me-2"
          ></i>

          Create Account

        }

      </button>

    </form>


    <!-- LOGIN LINK -->

    <div class="login-link">

      <span>
        Already have an account?
      </span>

      <a routerLink="/login">
        Login
      </a>

    </div>

  </div>

</div>
